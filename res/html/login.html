<!doctype html>
<html lang="cs" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>Přihlášení | Laboratoř bateriových systémů a emobility</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="../img/favicon.png" />
      <link rel="preload" href="/fonts/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/noto-sans-mono-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/noto-sans-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
  <div class="preloader">
    <img src="../img/logo.svg" alt="Načítání LBSE" class="preloader-img" />
  </div>
  <div class="container">
    <header id="header"></header>
    <div class="page-wrapper">
      <div class="main">
        <div class="hero-block">
          <h1>
            <span data-en="Admin" data-cs="Admin">ADMIN</span><br />
            <span class="highlight" data-en="LOGIN" data-cs="PŘIHLÁŠENÍ">PŘIHLÁŠENÍ</span>
          </h1>
          <div class="login-form">
            <div class="form-group">
              <label>Jméno</label>
              <input type="text" id="username" />
            </div>
            <div class="form-group">
              <label>Heslo</label>
              <input type="password" id="password" />
            </div>
            <p id="login-error" class="login-error"></p>
            <button class="admin-btn">Přihlásit</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer id="footer"></footer>
  <script src="/js/login.js" defer></script>
  <script src="/js/articles.js" defer></script>
  <script src="/js/header.js" defer></script>
  <script src="/js/main.js" defer></script>
  </script>
</body>

</html>
